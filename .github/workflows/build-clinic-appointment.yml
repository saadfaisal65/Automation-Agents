name: Build Clinic Appointment n8n Workflow

on:
  push:
    paths:
      - 'clinic-appointment/workflow/clinic-appointment-agent.json.gz.b64'
      - 'clinic-appointment/tests/workflow-tests.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore workflow JSON
        shell: bash
        run: |
          base64 -d clinic-appointment/workflow/clinic-appointment-agent.json.gz.b64 | gzip -d > clinic-appointment/workflow/clinic-appointment-agent.json
          python -m json.tool clinic-appointment/workflow/clinic-appointment-agent.json > /dev/null

      - name: Run workflow tests
        run: node clinic-appointment/tests/workflow-tests.js clinic-appointment/workflow/clinic-appointment-agent.json

      - name: Commit generated workflow
        shell: bash
        run: |
          if git diff --quiet -- clinic-appointment/workflow/clinic-appointment-agent.json; then
            echo 'Workflow JSON is already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add clinic-appointment/workflow/clinic-appointment-agent.json
          git commit -m 'Build clinic appointment n8n workflow JSON'
          git push
